name: Logic analyzer Python Cycle 2

on:
  workflow_dispatch:
  push:
    paths: ["Software/LogicAnalyzerPy/**", ".github/workflows/logic-analyzer-python-cycle2.yml"]
  pull_request:
    paths: ["Software/LogicAnalyzerPy/**", ".github/workflows/logic-analyzer-python-cycle2.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15-intel
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Verify governed macOS x86_64 runner
        shell: bash
        run: |
          architecture="$(uname -m)"
          if [ "$architecture" != "x86_64" ]; then
            printf 'unsupported runner architecture: %s (required: x86_64)\n' "$architecture" >&2
            exit 2
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22.14.0", cache: "npm", cache-dependency-path: "Software/LogicAnalyzerPy/web/package-lock.json"}
      - name: Create clean core Python 3.12 environment
        working-directory: Software/LogicAnalyzerPy
        run: python -m venv .venv
      - name: Install hash-locked core dependencies
        working-directory: Software/LogicAnalyzerPy
        run: .venv/bin/python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install core source without dependency resolution
        working-directory: Software/LogicAnalyzerPy
        run: .venv/bin/python -m pip install --no-build-isolation --no-deps -e .
      - name: Check core Python dependencies
        working-directory: Software/LogicAnalyzerPy
        run: .venv/bin/python -m pip check
      - name: Run Ruff
        working-directory: Software/LogicAnalyzerPy
        run: .venv/bin/python -m ruff check .
      - name: Run mypy
        working-directory: Software/LogicAnalyzerPy
        run: .venv/bin/python -m mypy src
      - name: Type-check the installed public decode consumer
        working-directory: Software/LogicAnalyzerPy
        run: .venv/bin/python -m mypy --strict tests/implementation/c3_b4_consumer.py
      - name: Run non-hardware Python tests
        working-directory: Software/LogicAnalyzerPy
        run: |
          log_file="$(mktemp)"
          probe_file="$(mktemp)"
          trap 'rm -f "$log_file" "$probe_file"' EXIT
          sanitize_report() {
            LC_ALL=C tail -c 1300 "$1" | LC_ALL=C tr -cd '\11\12\15\40-\176' | sed -E \
              -e 's#https?://[^[:space:]]+#<URL_REDACTED>#g' \
              -e 's#/dev/(tty|cu\.|serial/)[^[:space:]]*#<PORT_REDACTED>#g' \
              -e 's#/(Users|home)/[^[:space:]]*#<PATH_REDACTED>#g' \
              -e 's#pico_la_capability=[^;[:space:]]+#pico_la_capability=<TOKEN_REDACTED>#g' \
              -e 's#(^|[^[:alnum:]_-])[[:alnum:]_-]{43}([^[:alnum:]_-]|$)#\1<TOKEN_REDACTED>\2#g'
          }
          hostile_token='AbCdEfGhIjKlMnOpQrStUvWxYz0123456789_-abcde'
          printf 'actual=%s port=/dev/serial/by-id/hostile-device\n' "$hostile_token" >"$probe_file"
          probe="$(sanitize_report "$probe_file")"
          rm -f "$probe_file"
          case "$probe" in
            *"$hostile_token"*|*'/dev/serial/'*)
              printf '%s\n' 'workflow sanitizer self-test failed' >&2
              exit 2
              ;;
          esac
          case "$probe" in
            *'<TOKEN_REDACTED>'*'<PORT_REDACTED>') ;;
            *)
              printf '%s\n' 'workflow sanitizer self-test missing redaction marker' >&2
              exit 2
              ;;
          esac
          set +e
          : >"$log_file"
          (
            trap '' TERM
            .venv/bin/python -m pytest -q \
              tests/implementation/test_c3_b2_private_host.py::test_cleanup_regression_observation_cannot_change_timeout_or_cancelled_product_failure \
              --tb=short --disable-warnings
          ) >>"$log_file" 2>&1
          focused_status=$?
          if [ "$focused_status" -eq 0 ]; then
            .venv/bin/python -m pytest -m "not hardware" --tb=short --disable-warnings \
              --ignore tests/verification/test_c3_b1_threshold_proposal_round2.py \
              --ignore tests/verification/test_c3_b1_final_candidate.py \
              --ignore tests/verification/test_c3_b1_raw_baseline_candidate.py \
              --ignore tests/verification/test_c3_b1_runner_fixture_rebinding.py \
              --ignore tests/verification/test_c3_b1_semantic_fixture_candidate.py \
              --ignore tests/verification/test_c3_b1_threshold_proposal_round3.py \
              --ignore tests/verification/test_c3_b1_preexecution_runner_candidate.py \
              --ignore tests/verification/test_c3_b1_runner_fixture_rebinding_round4.py \
              --ignore tests/verification/test_c3_b1_final_candidate_round3.py \
              --ignore tests/verification/test_c3_b1_runner_fixture_rebinding_round5.py \
              --ignore tests/verification/test_c3_b1_semantic_fixture_correction_round2.py \
              --ignore tests/verification/test_c3_b1_runner_fixture_rebinding_round2.py \
              --ignore tests/verification/test_c3_b1_runner_fixture_rebinding_round3.py \
              --ignore tests/verification/test_c3_b1_threshold_proposal.py \
              --ignore tests/verification/test_c3_b1_semantic_fixture_correction.py \
              --deselect tests/implementation/test_cycle3_fixtures.py::test_cycle3_fixture_surface_is_present_and_rebuildable \
              --deselect tests/verification/test_c3_b4_public_round4.py::test_candidate_binding_and_exact_workflow_digest \
              --deselect tests/verification/test_c3_b4_public_round4.py::test_hosted_correction_preserves_every_prior_workflow_byte_and_gate_order \
              --deselect tests/implementation/test_c3_b2_private_host.py::test_cleanup_regression_observation_cannot_change_timeout_or_cancelled_product_failure \
              --deselect tests/verification/test_c3_b4_public_round5.py::test_candidate_binding_and_exact_workflow_digest \
              --deselect tests/verification/test_c3_b4_public_round5.py::test_partition_has_exact_ordered_unique_ignores_and_deselections \
              --deselect tests/verification/test_c3_b4_public_round5.py::test_every_candidate_b2_b3_b4_module_is_retained \
              --deselect tests/verification/test_c3_b4_public_round5.py::test_partition_is_the_only_workflow_change_from_round4 \
              --deselect tests/verification/test_c3_b4_public_round6.py::test_candidate_tree_and_workflow_digest_are_exact \
              --deselect tests/verification/test_c3_b4_public_round6.py::test_exact_ordered_partition_has_eight_unique_nodes_and_nine_cases \
              --deselect tests/verification/test_c3_b4_public_round6.py::test_runner_guard_and_every_other_gate_byte_are_preserved \
              >>"$log_file" 2>&1
            status=$?
          else
            status=$focused_status
          fi
          set -e
          report="$(sanitize_report "$log_file")"
          printf '%s\n' "$report"
          if [ "$status" -ne 0 ]; then
            annotation=${report//%/%25}
            annotation=${annotation//$'\r'/%0D}
            annotation=${annotation//$'\n'/%0A}
            printf '::error title=Cycle 3 non-hardware pytest failure::%s\n' "$annotation"
          fi
          exit "$status"
      - name: Check CLI help
        working-directory: Software/LogicAnalyzerPy
        run: |
          .venv/bin/python -m pico_logic_analyzer --help
          .venv/bin/python -m pico_logic_analyzer decode --help
      - name: Create clean web-runtime Python 3.12 environment
        working-directory: Software/LogicAnalyzerPy
        run: python -m venv .venv-web
      - name: Install hash-locked web-runtime dependencies
        working-directory: Software/LogicAnalyzerPy
        run: .venv-web/bin/python -m pip install --require-hashes -r requirements-web.lock
      - name: Install web source without dependency resolution
        working-directory: Software/LogicAnalyzerPy
        run: .venv-web/bin/python -m pip install --no-build-isolation --no-deps -e '.[web]'
      - name: Check web-runtime Python dependencies
        working-directory: Software/LogicAnalyzerPy
        run: .venv-web/bin/python -m pip check
      - name: Install locked Node dependencies
        working-directory: Software/LogicAnalyzerPy/web
        run: npm ci --no-audit --no-fund
      - name: Run frontend lint
        working-directory: Software/LogicAnalyzerPy/web
        run: npm run lint
      - name: Run frontend typecheck
        working-directory: Software/LogicAnalyzerPy/web
        run: npm run typecheck
      - name: Run frontend unit tests
        working-directory: Software/LogicAnalyzerPy/web
        run: npm test -- --run
      - name: Build production frontend assets
        working-directory: Software/LogicAnalyzerPy/web
        run: npm run build
      - name: Check production asset drift
        working-directory: Software/LogicAnalyzerPy
        run: .venv/bin/python scripts/check_web_assets.py
      - name: Install Chromium for macOS browser smoke
        working-directory: Software/LogicAnalyzerPy/web
        run: npx playwright install chromium
      - name: Run production browser smoke
        working-directory: Software/LogicAnalyzerPy/web
        run: npm run test:browser
