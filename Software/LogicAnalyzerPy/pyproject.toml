[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pico-logic-analyzer"
version = "0.1.0"
description = "Cycle 1 command-line scaffold for the Pico logic analyzer"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Pico logic analyzer contributors"}]
dependencies = ["numpy==2.2.2", "pyserial==3.5"]

[project.scripts]
pico-la = "pico_logic_analyzer.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["hardware: requires an explicitly supplied physical analyzer"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
